[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videoauto"
version = "0.1.0"
description = "Local Vietnamese video translation and dubbing queue"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.2",
  "pydantic==2.13.5",
  "psutil==7.2.2",
  "python-multipart==0.0.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
