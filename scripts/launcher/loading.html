<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Auto</title>
<link rel="icon" href="videoauto.ico">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 80% -10%, #222c3f 0, #0e1117 45%); color: #e9edf5; font: 14px Manrope, "Segoe UI", sans-serif; }
  main { text-align: center; max-width: 420px; padding: 24px; }
  .mark { width: 56px; height: 56px; margin: 0 auto 22px; border-radius: 15px; background: #b7ef67; color: #16200d; display: grid; place-items: center; font-weight: 800; letter-spacing: -.5px; }
  h1 { font-size: 22px; letter-spacing: -.6px; margin: 0 0 8px; }
  p { color: #8c97a8; line-height: 1.6; margin: 0; }
  .bar { height: 4px; border-radius: 4px; background: #252d39; overflow: hidden; margin: 24px auto 14px; width: 220px; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #b7ef67; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .slow { color: #e8b65b; }
  .failed { color: #ffaba2; }
  code { font: 12px "DM Mono", Consolas, monospace; color: #b7ef67; }
</style>
</head>
<body>
<main>
  <div class="mark">VA</div>
  <h1>Đang khởi động Video Auto</h1>
  <div class="bar" id="bar"><i></i></div>
  <p id="status">Đang bật máy chủ và các dịch vụ đi kèm…</p>
</main>
<script>
  // Opened from disk by scripts\open-app.ps1. A no-cors request resolves as soon
  // as the local server answers, so it works without the server allowing CORS.
  const app = 'http://127.0.0.1:8765/';
  const started = Date.now();
  const status = document.getElementById('status');
  async function poll() {
    try {
      await fetch(app + 'api/v1/health/live', { mode: 'no-cors', cache: 'no-store' });
      status.textContent = 'Đã sẵn sàng, đang mở…';
      location.replace(app);
      return;
    } catch (error) { /* not listening yet */ }
    const seconds = (Date.now() - started) / 1000;
    if (seconds > 300) {
      document.getElementById('bar').hidden = true;
      status.className = 'failed';
      status.innerHTML = 'Video Auto chưa khởi động được sau 5 phút.<br>Một hộp thông báo sẽ chỉ chỗ xem nhật ký. Thử chạy lại lối tắt Video Auto hoặc <code>scripts\\status.ps1</code>.';
      return;
    }
    if (seconds > 45) {
      status.className = 'slow';
      status.textContent = 'Lần đầu khởi động có thể mất một lúc. Trang sẽ tự mở khi sẵn sàng…';
    }
    setTimeout(poll, 1000);
  }
  poll();
</script>
</body>
</html>
